version: 1

actual:
  cacheDirectory: /data/actual-cache
  passwordEnv: ACTUAL_PASSWORD
  serverUrl: https://actual.example.com
  syncId: 00000000-0000-4000-8000-000000000000

categoryMappings:
  restaurants-and-cafes: 00000000-0000-4000-8000-000000000003

mappings:
  - alias: joint-spending
    upAccountId: 00000000-0000-4000-8000-000000000001
    actualAccountId: 00000000-0000-4000-8000-000000000002
    connections:
      - alex
      - sam

notes:
  includeCashback: true
  includeForeignAmount: true
  includeMessage: true
  includePerformer: true
  includeRoundUp: false

schedule:
  enabled: false
  cron: "*/15 * * * *"
  lookbackDays: 30
  timezone: Australia/Sydney

server:
  host: 0.0.0.0
  port: 3000
  publicUrl: https://actual-up.example.com

up:
  connections:
    - id: alex
      tokenEnv: UP_TOKEN_ALEX
    - id: sam
      tokenEnv: UP_TOKEN_SAM
