[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["build", "check:actions", "check:chart", "check:oxfmt", "check:updates"]
run = ["oxlint --deny-warnings src test", { task = "check:typescript" }, { task = "test" }]

[tasks."check:chart"]
run = """
helm lint chart/actual-up --set existingConfigMap=test
helm template test chart/actual-up --set existingConfigMap=test
"""

[tasks.dev]
depends = ["build"]
run = "node dist/cli.js serve"

[tasks.fmt]
depends = ["fmt:oxfmt"]

[tasks.test]
run = "vitest run"

# Setup
[tasks.setup]
run = "npm ci"
