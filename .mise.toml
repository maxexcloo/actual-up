[tools]
helm = "4.3.0"
node = "26.11.1"
updatecli = "0.122.1"

[tasks.check]
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
npm run check
"""

[tasks.fmt]
run = "npm run format"

[tasks.setup]
run = "npm ci"

# Dependency Updates
[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""
