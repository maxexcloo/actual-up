[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:oxlint",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
]

[tasks."check:oxlint"]
run = "oxlint --deny-warnings"

[tasks."check:typescript"]
run = '''
set -eu
tsc --noEmit
tsc --noEmit -p web
'''

[tasks.dev]
run = "fnox exec -- node dist/cli.js --config config.local.yaml serve"
depends = ["build"]

[tasks.test]
run = "vitest run"
depends = ["build"]
