[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = [
  "build",
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:oxlint",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
]

[tasks."check:oxlint"]
run = "oxlint --deny-warnings src test"

[tasks.dev]
run = "node dist/cli.js serve"
depends = ["build"]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt"]

[tasks.test]
run = "vitest run"

# Setup
[tasks.setup]
run = "npm ci"
