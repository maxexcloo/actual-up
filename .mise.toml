[tools]
# gh = "latest"
# helm = "latest"
# node = "latest"
# updatecli = "latest"

[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["build"]
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
prettier --check .
oxlint --deny-warnings src test
tsc --noEmit
vitest run
"""

[tasks.dev]
depends = ["build"]
run = "node dist/cli.js serve"

[tasks.fmt]
run = "prettier --write ."

[tasks.test]
run = "vitest run"

# Setup
[tasks.setup]
run = "npm ci"
