# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Major Action Aliases
pipelineid: update-major-action-aliases
autodiscovery:
  crawlers:
    github/action:
      digest: false
      credentials:
        github.com:
          token: '{{ env "GITHUB_TOKEN" }}'
          kind: github
      only:
        - actions:
            actions/checkout: ""
            docker/build-push-action: ""
            docker/login-action: ""
            docker/metadata-action: ""
            docker/setup-buildx-action: ""
            jdx/mise-action: ""
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
      rootdir: .github
      age:
        minimum: 1d
labels:
  group: actions
