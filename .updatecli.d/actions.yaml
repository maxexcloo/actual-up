# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Actions
pipelineid: update-actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      rootdir: .github
      ignore:
        - actions:
            aquasecurity/trivy-action: ""
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
labels:
  group: actions
---
# Trivy Action publishes no major tags, so it tracks exact releases.
name: Update Versioned Actions
pipelineid: update-versioned-actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      rootdir: .github
      only:
        - actions:
            aquasecurity/trivy-action: ""
      versionfilter:
        kind: semver
        pattern: "*"
labels:
  group: actions
