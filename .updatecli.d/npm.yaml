# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update npm
pipelineid: update-npm
autodiscovery:
  crawlers:
    npm:
      age:
        minimum: 1d
      ignore:
        - packages:
            "@types/node": ""
labels:
  group: npm
---
# Node types follow the minimum supported Node major in package.json engines.
name: Update Node Types
pipelineid: update-node-types
autodiscovery:
  crawlers:
    npm:
      age:
        minimum: 1d
      only:
        - packages:
            "@types/node": ""
      versionfilter:
        kind: semver
        pattern: ~26
labels:
  group: npm
