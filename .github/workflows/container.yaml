name: Container

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Identify Image Inputs
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pending main runs can be replaced; include every change not yet verified and published.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            BASE_REVISION=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container.yaml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          fi
          image=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ] && [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != 0000000000000000000000000000000000000000 ]; then
            if git merge-base --is-ancestor HEAD "$BASE_REVISION" || git diff --quiet "$BASE_REVISION" HEAD -- . ':!AGENTS.md' ':!LICENSE' ':!README.md' ':!docs/**' ':!.gitignore' ':!.mise.toml' ':!.updatecli.d/**'; then
              image=false
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check

  image:
    name: Image
    if: needs.check.outputs.image == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: metadata
        name: Extract Metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build Image for Verification
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          load: true
          platforms: linux/amd64
          tags: actual-up:test
      - name: Smoke-Test Runtime
        run: |
          docker run --cap-drop=ALL --read-only --rm \
            --security-opt=no-new-privileges actual-up:test node dist/cli.js --help
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          ignore-unfixed: true
          image-ref: actual-up:test
          severity: CRITICAL,HIGH
      - name: Log In to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: publish
        name: Publish Verified Image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Summarise Image
        if: steps.publish.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo 'Published image tags:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
