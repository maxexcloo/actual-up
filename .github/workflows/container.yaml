name: Container

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    # Path filters do not apply to tag pushes, so releases always build.
    paths-ignore:
      - "**.md"
      - .gitignore
      - LICENSE
    tags:
      - "v*"

permissions:
  contents: read

# A newer push supersedes an older run; release tags always finish.
concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node@24 node@26 npm:renovate oxfmt
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: metadata
        name: Extract Metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build Image For Verification
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          # Other refs' caches are not restored elsewhere and would evict the default branch's cache.
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,mode=max,ignore-error=true' || '' }}
          context: .
          load: true
          platforms: linux/amd64
          tags: actual-up:test
      - name: Smoke-Test Runtime
        run: |
          docker run --cap-drop=ALL --read-only --rm \
            --security-opt=no-new-privileges actual-up:test node dist/cli.js --help
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          ignore-unfixed: true
          image-ref: actual-up:test
          severity: CRITICAL,HIGH
      - if: env.PUBLISH == 'true'
        name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      # Reuses the verified layers from the builder's cache.
      - if: env.PUBLISH == 'true'
        name: Publish Image
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
