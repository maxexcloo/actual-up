name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check project
        run: pnpm run check

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          tags: actual-up:test
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          image-ref: actual-up:test
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Lint chart
        run: helm lint chart/actual-up --set existingConfigMap=test
      - name: Render chart
        run: helm template test chart/actual-up --set existingConfigMap=test
