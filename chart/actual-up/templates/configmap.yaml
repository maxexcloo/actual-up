{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "actual-up.fullname" . }}
  labels:
    {{- include "actual-up.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- required "configuration or existingConfigMap is required" .Values.configuration | nindent 4 }}
{{- end }}
